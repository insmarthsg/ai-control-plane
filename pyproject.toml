[project]
name = "ai-control-plane"
version = "0.1.0"
description = "Task control layer over an execution harness: provider error classification and health."
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "real_dsh: real provider smoke; requires ACP_REAL_DSH_SMOKE=1",
]
